[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handlecheck"
version = "0.1.0"
description = "Check which online services a username exists on"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "websockets>=15"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
handlecheck = "handlecheck.cli:main"

[tool.setuptools]
packages = ["handlecheck"]

[tool.setuptools.package-data]
handlecheck = ["sites.json"]
